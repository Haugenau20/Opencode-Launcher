# Overlay: the opt-in autonomous orchestrator. Pull-only mirror of
# OpenCode-Setup's docker-compose.symphony.yml — see docs/SYNC.md. Like the
# base stack, this launcher never BUILDS the symphony image; its source
# (symphony/Dockerfile, the vendored symphony-queue) lives only in the
# maintainer repo. There is no `build:` block here — do not add one.
#
# Brought up with:
#   ./start.sh --symphony up <host-repo-path>
# not raw compose: symphony's settings live in .symphony/<slug>/symphony.env,
# and MUST STAY OUT of .envs/<slug>.env (the file docker-compose.yml hands to
# the AGENT's container wholesale via PROJECT_ENV_FILE). lib/symphony.sh is
# what puts both files in front of compose — the launcher-side counterpart of
# the maintainer's ./scripts/symphony:
#
#   docker compose --env-file .envs/<slug>.env --env-file .symphony/<slug>/symphony.env \
#                  -f docker/docker-compose.yml -f docker/docker-compose.symphony.yml \
#                  -p opencode-<slug> up -d
#
# Nothing in the base stack changes when this file is absent, which is the
# point: symphony is a different way of working, not a new default. Read
# docs/SYMPHONY.md (OpenCode-Setup) before the first run — in particular the
# part about scoping the GitLab token, which is the containment that
# actually holds.
name: opencode-${PROJECT_SLUG:-default}

services:
  symphony:
    image: ${IMAGE_REGISTRY:-opencode-workplace}-symphony:${IMAGE_TAG:-local}
    container_name: opencode-symphony-${PROJECT_SLUG:-default}
    hostname: symphony
    depends_on:
      - opencode
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      SYMPHONY_QUEUE_ROOT: /queue
      SYMPHONY_WORKSPACES_ROOT: /workspaces
      SYMPHONY_WORKFLOW: /config/WORKFLOW.md
      # Follows the opencode container's INTERNAL port (same
      # OPENCODE_INTERNAL_PORT parameterization Wave 1 introduced for
      # PROJECT_ENV_FILE), not OPENCODE_PORT: this is a container-to-container
      # URL on an internal network, so the host publication is irrelevant to
      # it. Keep opencode.server_url in WORKFLOW.md pointing at the same
      # place — that is what the orchestrator actually dials; this one drives
      # the entrypoint's readiness wait.
      SYMPHONY_OPENCODE_URL: http://opencode:${OPENCODE_INTERNAL_PORT:-4096}
      SYMPHONY_LOG_LEVEL: ${SYMPHONY_LOG_LEVEL:-info}
      # Only set for tracker.kind: gitlab. Leave blank for the file queue and
      # this container keeps its stronger posture: no credentials at all.
      #
      # This MUST be a PROJECT access token with the REPORTER role — it can
      # read and write issues on one project and cannot push code. The
      # agent's Developer token (GITLAB_PAT) lives in .envs/<slug>.env, the
      # AGENT's container environment, and never reaches this service.
      # Neither token can do the other's job — docs/SYMPHONY.md §3 ("two
      # tokens, neither able to do the other's job").
      SYMPHONY_GITLAB_TOKEN: ${SYMPHONY_GITLAB_TOKEN:-}
      # Egress for the GitLab tracker only, and not a value you set by hand:
      # lib/symphony.sh derives it from tracker.kind in WORKFLOW.md. With
      # tracker.kind: file_queue it stays empty and the container has no
      # route off-host at all — both its networks below are internal: true,
      # so squid is the only possible way out either way.
      HTTP_PROXY: ${SYMPHONY_HTTP_PROXY:-}
      HTTPS_PROXY: ${SYMPHONY_HTTP_PROXY:-}
      http_proxy: ${SYMPHONY_HTTP_PROXY:-}
      https_proxy: ${SYMPHONY_HTTP_PROXY:-}
      NO_PROXY: "localhost,127.0.0.1,::1,opencode,squid"
      no_proxy: "localhost,127.0.0.1,::1,opencode,squid"
    volumes:
      # The queue. Bind-mounted from the host so `ls`, `mv` and your editor
      # are the management UI. All six file-queue state directories live
      # under this one root: the claim is a rename(2) between them, which is
      # only atomic within a single filesystem.
      - ${SYMPHONY_QUEUE_PATH:-./.symphony/default/queue}:/queue:z
      # Per-item agent workspaces. NOT the repo at ${REPO_PATH} — symphony
      # clones fresh per item and must never be pointed at working state you
      # care about.
      - ${SYMPHONY_WORKSPACES_PATH:-./.symphony/default/workspaces}:/workspaces:z
      # WORKFLOW.md — the per-project prompt + config. Read-only: it is
      # trusted input (it drives hooks), and the agent must never be able to
      # edit it. config/ is a SUBDIRECTORY of .symphony/<slug>/, one level
      # below symphony.env, and that is load-bearing: only this directory is
      # bind-mounted in here, so symphony.env (which holds
      # SYMPHONY_GITLAB_TOKEN) never crosses into the container. See
      # lib/symphony.sh's preflight, which refuses to start if an agent env
      # file is readable from in here.
      - ${SYMPHONY_CONFIG_PATH:-./.symphony/default/config}:/config:ro,z
    networks:
      # oc_internal reaches opencode. oc_proxy is only useful once
      # SYMPHONY_HTTP_PROXY points at squid, which lib/symphony.sh sets for
      # the gitlab tracker; on the file queue symphony has no egress
      # regardless, because both networks are internal: true and squid is
      # the only way out.
      - oc_internal
      - oc_proxy
    restart: unless-stopped

  # The agent's workspaces have to be visible to the container that actually
  # runs the agent, at the same path symphony hands it in the prompt.
  opencode:
    volumes:
      - ${SYMPHONY_WORKSPACES_PATH:-./.symphony/default/workspaces}:/workspaces:z
    environment:
      # Symphony's per-item workspaces sit OUTSIDE the /workspace project
      # root, and opencode gates any tool touching an external path behind
      # `permission.external_directory`, which defaults to "ask". Unattended
      # means nobody is there to answer, so without this the very first file
      # operation of every run blocks forever.
      #
      # This is the same generic hook the launcher uses for its --also
      # mounts (lib/also.sh); here the overlay plays the launcher's role.
      # Only this glob is allowed — everything else still hits the "ask"
      # default.
      OPENCODE_EXTRA_ALLOWED_DIRS: /workspaces/**
      # Symphony runs unattended, so remote git must be on. That makes the
      # destination allowlist the thing standing between a confused agent
      # and your production repos — but only as defence in depth. The
      # boundary is the token's project scope: see docs/SYMPHONY.md.
      ALLOW_REMOTE_GIT: ${ALLOW_REMOTE_GIT:-0}
      GIT_REMOTE_ALLOWLIST: ${GIT_REMOTE_ALLOWLIST:-}
