# Pull-only stack. Every image here is fetched from the configured Artifactory
# (${IMAGE_REGISTRY}:${IMAGE_TAG}); nothing is built from this repo. The only
# local build is the opt-in system-package layer, which lives in its own overlay
# (docker-compose.user-packages.yml) and is applied by start.sh on demand.
name: opencode-${PROJECT_SLUG:-default}

services:
  opencode:
    image: ${IMAGE_REGISTRY:-opencode-workplace}:${IMAGE_TAG:-local}
    container_name: opencode-${PROJECT_SLUG:-default}
    hostname: opencode
    depends_on:
      - squid
    env_file:
      # Two layers, last wins — order IS the mechanism. .env holds what every
      # project shares; the per-project file (PROJECT_ENV_FILE, generated by
      # write_project_env in lib/project.sh as .env plus per-project settings)
      # holds what differs, above all scoped credentials. Unset, this defaults
      # to .env, so it's simply read twice and nothing changes for the
      # single-project case. `required: false` keeps a project with no
      # generated file yet from being an error.
      #
      # A per-project value may also BLANK an inherited one (`SOME_PAT=`),
      # which drops that credential from the stack entirely rather than
      # merely disabling it — see docs/SYNC.md.
      - .env
      - path: ${PROJECT_ENV_FILE:-.env}
        required: false
    environment:
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      http_proxy: http://squid:3128
      https_proxy: http://squid:3128
      # The docker-side copy of the image's own policy.yaml NO_PROXY, so
      # in-container DNS for the sidecars (opencode, squid, rag) bypasses the
      # proxy. Deliberately NO `.local`: a corp service addressed by a *.local
      # FQDN (e.g. bitbucket.corp.local) would otherwise match and be routed
      # DIRECTLY instead of through squid — which breaks git/curl to it, since
      # squid is the only way out. Do not re-add it; the maintainer repo
      # dropped it in image 0.1.0 for exactly this reason.
      NO_PROXY: "localhost,127.0.0.1,::1,opencode,squid,rag"
      no_proxy: "localhost,127.0.0.1,::1,opencode,squid,rag"
      # The in-container listen port. oc-publish's socat forwarder below reads
      # the same variable, so there is one place to change it. NOT
      # OPENCODE_PORT: that is the HOST port, kept decoupled so several stacks
      # can differ on the host while all stay on 4096 inside.
      OPENCODE_INTERNAL_PORT: "${OPENCODE_INTERNAL_PORT:-4096}"
      PROJECT_SLUG: ${PROJECT_SLUG:-default}
      # opencode-pty viewer: must bind non-loopback (0.0.0.0) so oc-publish's
      # second socat leg below can reach it from its own container. Port is
      # derived from OPENCODE_PORT by prepending '1' (assumes OPENCODE_PORT
      # stays a 4-digit port — same assumption oc-publish's ports: mapping
      # below makes).
      PTY_WEB_HOSTNAME: "0.0.0.0"
      PTY_WEB_PORT: "1${OPENCODE_PORT:-4096}"
    volumes:
      # :z relabels the host repo for SELinux (shared, not :Z) so an enforcing
      # host doesn't deny the container access. Named volumes are auto-labelled.
      - ${REPO_PATH:-./repo}:/workspace:z
      - oc_state:/home/dev/.local/share/opencode
      - oc_cfg:/home/dev/.config/opencode
    networks:
      # Internal-only, and it must stay that way — see the networks: block.
      - oc_proxy
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    stdin_open: true
    tty: true
    stop_grace_period: 1s

  oc-publish:
    image: ${IMAGE_REGISTRY:-opencode-workplace}-squid:${IMAGE_TAG:-local}
    container_name: opencode-publish-${PROJECT_SLUG:-default}
    hostname: oc-publish
    depends_on:
      - opencode
    # Two socat legs: the main web UI (4096) and, second, the opencode-pty
    # viewer on the derived 1<OPENCODE_PORT> port — only live once the plugin
    # is enabled and its server is started in the TUI (/pty-open-background-spy).
    # `trap ... wait` ties both listeners to this shell's lifetime so
    # `docker stop`/compose down still terminate it cleanly.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'kill 0' TERM INT
        socat TCP-LISTEN:${OPENCODE_INTERNAL_PORT:-4096},fork,reuseaddr TCP:opencode:${OPENCODE_INTERNAL_PORT:-4096} &
        socat TCP-LISTEN:1${OPENCODE_PORT:-4096},fork,reuseaddr TCP:opencode:1${OPENCODE_PORT:-4096} &
        wait
    ports:
      # host:container — OPENCODE_PORT is the host side (varies per stack),
      # OPENCODE_INTERNAL_PORT the container side (stays 4096, leave it alone).
      - "127.0.0.1:${OPENCODE_PORT:-4096}:${OPENCODE_INTERNAL_PORT:-4096}"
      - "127.0.0.1:1${OPENCODE_PORT:-4096}:1${OPENCODE_PORT:-4096}"
    networks:
      - oc_proxy
      - oc_external
    restart: unless-stopped
    stop_grace_period: 1s

  squid:
    image: ${IMAGE_REGISTRY:-opencode-workplace}-squid:${IMAGE_TAG:-local}
    container_name: opencode-squid-${PROJECT_SLUG:-default}
    hostname: squid
    volumes:
      # Short syntax so the SELinux flag is expressible: ro = read-only,
      # z = shared relabel (the same host dir is mounted across every project's
      # stack, so :z not :Z). create_host_path isn't available in short form;
      # extra-allowlist.d is committed to the repo so it always exists.
      #
      # Per-project override: point EXTRA_ALLOWLIST_PATH at a project's own
      # directory to give that stack a different egress surface. Opt-in only
      # — leave it unset unless the project actually ships an allowlist dir,
      # or an empty one shadows the shared list.
      - ${EXTRA_ALLOWLIST_PATH:-./extra-allowlist.d}:/etc/squid/extra-allowlist.d:ro,z
    networks:
      - oc_proxy
      - oc_external
    stop_grace_period: 1s

# Two networks: opencode gets an internal-only one, squid gets the external
# one. That is the floor this model permits, and each extra costs a subnet
# from dockerd's address pools (~32 on a stock daemon, shared host-wide).
#
# INVARIANT: no agent container on a non-internal network — squid is the only
# route off-host. tests/compose.bats asserts it.
networks:
  oc_proxy:
    driver: bridge
    internal: true
  # Reaches off-host: squid's egress, and oc-publish's published ports.
  oc_external:
    driver: bridge

volumes:
  oc_state:
    name: opencode-${PROJECT_SLUG:-default}_state
  oc_cfg:
    name: opencode-${PROJECT_SLUG:-default}_cfg
