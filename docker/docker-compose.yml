# Pull-only stack. Every image here is fetched from the configured Artifactory
# (${IMAGE_REGISTRY}:${IMAGE_TAG}); nothing is built from this repo. The only
# local build is the opt-in system-package layer, which lives in its own overlay
# (docker-compose.user-packages.yml) and is applied by start.sh on demand.
name: opencode-${PROJECT_SLUG:-default}

services:
  opencode:
    image: ${IMAGE_REGISTRY:-opencode-workplace}:${IMAGE_TAG:-local}
    container_name: opencode-${PROJECT_SLUG:-default}
    hostname: opencode
    depends_on:
      - squid
    env_file:
      - .env
    environment:
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      http_proxy: http://squid:3128
      https_proxy: http://squid:3128
      NO_PROXY: "localhost,127.0.0.1,::1,opencode,squid,rag,.local"
      no_proxy: "localhost,127.0.0.1,::1,opencode,squid,rag,.local"
      OPENCODE_INTERNAL_PORT: "4096"
      PROJECT_SLUG: ${PROJECT_SLUG:-default}
    volumes:
      # :z relabels the host repo for SELinux (shared, not :Z) so an enforcing
      # host doesn't deny the container access. Named volumes are auto-labelled.
      - ${REPO_PATH:-./repo}:/workspace:z
      - oc_state:/home/dev/.local/share/opencode
      - oc_cfg:/home/dev/.config/opencode
    networks:
      - oc_internal
      - oc_proxy
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    stdin_open: true
    tty: true
    stop_grace_period: 1s

  oc-publish:
    image: ${IMAGE_REGISTRY:-opencode-workplace}-squid:${IMAGE_TAG:-local}
    container_name: opencode-publish-${PROJECT_SLUG:-default}
    hostname: oc-publish
    depends_on:
      - opencode
    entrypoint: ["socat"]
    command: ["TCP-LISTEN:4096,fork,reuseaddr", "TCP:opencode:4096"]
    ports:
      - "127.0.0.1:${OPENCODE_PORT:-4096}:4096"
    networks:
      - oc_proxy
      - oc_publish
    restart: unless-stopped
    stop_grace_period: 1s

  squid:
    image: ${IMAGE_REGISTRY:-opencode-workplace}-squid:${IMAGE_TAG:-local}
    container_name: opencode-squid-${PROJECT_SLUG:-default}
    hostname: squid
    volumes:
      # Short syntax so the SELinux flag is expressible: ro = read-only,
      # z = shared relabel (the same host dir is mounted across every project's
      # stack, so :z not :Z). create_host_path isn't available in short form;
      # extra-allowlist.d is committed to the repo so it always exists.
      - ./extra-allowlist.d:/etc/squid/extra-allowlist.d:ro,z
    networks:
      - oc_proxy
      - oc_egress
    stop_grace_period: 1s

networks:
  oc_internal:
    driver: bridge
    internal: true
  oc_proxy:
    driver: bridge
    internal: true
  oc_egress:
    driver: bridge
  oc_publish:
    driver: bridge

volumes:
  oc_state:
    name: opencode-${PROJECT_SLUG:-default}_state
  oc_cfg:
    name: opencode-${PROJECT_SLUG:-default}_cfg
